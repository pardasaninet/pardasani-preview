<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
<title>Site components, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@300;400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
:root{--ground:#f1f0ec;--ink:#161616;--body:#3b3a37;--muted:#5f5e5a;--tone2:#85837d;--hairline:#c9c7c0;--tile:#e4e2dc;--surface:#f8f7f3;--placeholder:#d3d1ca;--outline:rgba(22,22,22,0.14);--gradient:radial-gradient(90% 85% at 0% 100%,#b49d91 0%,rgba(180,157,145,0) 62%),radial-gradient(70% 80% at 100% 10%,#74b0df 0%,rgba(116,176,223,0) 65%),radial-gradient(60% 70% at 100% 100%,#8fb9d2 0%,rgba(143,185,210,0) 70%),linear-gradient(135deg,#2456ac 0%,#3f7fc8 45%,#8fb9d2 100%);--gradient-solid:#2c5ea8;--glass-gradient-fill:rgba(241,240,236,0.18);--glass-gradient-line:rgba(241,240,236,0.65);--glass-image-fill:rgba(241,240,236,0.72);--glass-image-line:rgba(255,255,255,0.8);--r-media:20px;--r-chip:14px;--r-pill:999px;--margin:clamp(12px,1.875vw,24px);--gap-t:12px;--gap-s:clamp(24px,3.1vw,40px);--gap-w:clamp(120px,15.6vw,200px);--ease:cubic-bezier(0.2,0.8,0.2,1);--sans:'Funnel Sans',ui-sans-serif,system-ui,sans-serif;--mono:'Antarctican Mono','IBM Plex Mono',ui-monospace,monospace}
.root{min-height:100%;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;text-wrap:pretty;-webkit-font-smoothing:antialiased}
.root h1,.root h2,.root h3,.root h4{text-wrap:balance}
.gradient{background:var(--gradient)}
.glass-g{background:var(--glass-gradient-fill);border:1px solid var(--glass-gradient-line);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);color:var(--ground)}
.glass-i{background:var(--glass-image-fill);border:1px solid var(--glass-image-line);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);color:var(--ink)}
.frost{background:rgba(241,240,236,0.72);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.solid .glass-g,.glass-g.solid{background:var(--gradient-solid);-webkit-backdrop-filter:none;backdrop-filter:none}
.solid .glass-i,.glass-i.solid,.solid .frost,.frost.solid{background:var(--ground);-webkit-backdrop-filter:none;backdrop-filter:none}
@media (prefers-reduced-transparency:reduce){.glass-g{background:var(--gradient-solid);-webkit-backdrop-filter:none;backdrop-filter:none}.glass-i,.frost{background:var(--ground);-webkit-backdrop-filter:none;backdrop-filter:none}}
.grain{position:absolute;inset:0;width:100%;height:100%;opacity:0.04;pointer-events:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.t-label{margin:0;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;line-height:1.35}
.t-kind{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;line-height:1.35}
.t-tag{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;box-sizing:border-box;border:1px solid currentColor;border-radius:999px;font-family:var(--mono);font-size:11px;letter-spacing:0.05em;text-transform:uppercase;white-space:nowrap;line-height:1}
.t-code{font-family:var(--mono);font-size:12px;letter-spacing:0;text-transform:none}
.t-page{margin:0;font-size:clamp(88px,21vw,270px);font-weight:800;letter-spacing:-0.07em;line-height:0.78}
.t-case{margin:0;font-size:clamp(64px,17vw,218px);font-weight:800;letter-spacing:-0.065em;line-height:0.8}
.t-statement{margin:0;font-size:clamp(24px,2.5vw,32px);font-weight:500;letter-spacing:-0.022em;line-height:1.2}
.t-quote{margin:0;font-size:clamp(26px,2.7vw,34px);font-weight:500;letter-spacing:-0.022em;line-height:1.2}
.t-heading{margin:0;font-size:clamp(21px,1.9vw,24px);font-weight:700;letter-spacing:-0.025em;line-height:1.15}
.t-body{margin:0;font-size:clamp(16px,1.42vw,18px);line-height:1.55;color:var(--body)}
.tone2{color:var(--tone2)}
.nudge{display:inline-block;transform:translateY(-0.06em)}
.split,.row{display:flex;flex-wrap:wrap;column-gap:12px}
.split{row-gap:var(--gap-s)}
.row{row-gap:12px}
/* Bento grids (project cards, About tiles): 14px gaps, a touch wider than the 12px page grid */
.bento{column-gap:14px;row-gap:14px}
.bento>.c4{width:clamp(calc((100% - 126px) * 0.4 + 42px),calc((720px - 100%) * 999),100%)}
.bento>.c6{width:clamp(calc((100% - 126px) * 0.6 + 70px),calc((720px - 100%) * 999),100%)}
.c2,.c3,.c4,.c5,.c6,.c7{flex:none;min-width:0}
.c2{width:clamp(calc((100% - 108px) * 0.2 + 12px),calc((720px - 100%) * 999),calc(50% - 6px))}
.c3{width:clamp(calc((100% - 108px) * 0.3 + 24px),calc((720px - 100%) * 999),100%)}
.c4{width:clamp(calc((100% - 108px) * 0.4 + 36px),calc((720px - 100%) * 999),100%)}
.c5{width:clamp(calc((100% - 108px) * 0.5 + 48px),calc((720px - 100%) * 999),100%)}
.c6{width:clamp(calc((100% - 108px) * 0.6 + 60px),calc((720px - 100%) * 999),100%)}
.c7{width:clamp(calc((100% - 108px) * 0.7 + 72px),calc((720px - 100%) * 999),100%)}
.c10{flex:none;width:100%;min-width:0}
.o5{margin-left:clamp(0px,calc((100% - 720px) * 999),calc((100% - 108px) * 0.5 + 60px))}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.on-dark a:focus-visible,.on-dark button:focus-visible{outline-color:var(--ground)}
.is-focus{outline:2px solid var(--ink);outline-offset:3px}
.on-dark .is-focus{outline-color:var(--ground)}
.still,.still *{transition-duration:0.01ms!important;transition-delay:0s!important}
.nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:4px var(--margin)}
.nav-home{display:flex;align-items:center;gap:8px;min-height:44px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:800;letter-spacing:-0.02em;white-space:nowrap}
.nav-home img{display:block;width:27px;height:28px}
.nav-links{display:flex;align-items:center;margin-right:-10px}
.nav-link{display:flex;align-items:center;min-height:44px;padding:0 10px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;transition:color 160ms var(--ease)}
.nav-link:hover,.nav-link.is-hover{color:var(--ink)}
.nav-link[aria-current="page"]{color:var(--ink);font-weight:600}
@media (max-width:540px){.nav-name{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.nav-link{padding:0 8px}.nav-links{margin-right:-8px}}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;box-sizing:border-box;border-radius:999px;text-decoration:none;font-size:15px;font-weight:600;white-space:nowrap;transition:background-color 160ms var(--ease)}
.glass-g.pill:hover,.glass-g.pill.is-hover{background:rgba(241,240,236,0.32)}
.chip{position:relative;display:inline-flex;align-items:center;min-height:36px;padding:0 14px;box-sizing:border-box;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;transition:background-color 160ms var(--ease),color 160ms var(--ease)}
.chip::before{content:"";position:absolute;inset:-4px -3px}
.chip:hover,.chip.is-hover{background:rgba(22,22,22,0.06)}
.chip[aria-pressed="true"],.chip.is-active{background:var(--ink);color:var(--ground)}
.card{position:relative;display:block;overflow:hidden;border-radius:var(--r-media);background:var(--placeholder);color:var(--ink);text-decoration:none;isolation:isolate}
/* Raised glass edge: the softest shadow underneath and a hairline of light inside the edge, so cards lift off the page without darkening it */
:root{--raise:0 1px 2px rgba(22,22,22,0.05),0 6px 16px -10px rgba(22,22,22,0.12);--raise-in:inset 0 1px 0 rgba(255,255,255,0.55),inset 0 0 0 1px rgba(255,255,255,0.22)}
.card,.tile{box-shadow:var(--raise)}
.card::after,.tile::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:var(--raise-in);pointer-events:none;z-index:5}
.card-img{position:absolute;inset:0;background:var(--placeholder);transition:transform 520ms var(--ease)}
.card:hover .card-img,.card.is-hover .card-img{transform:scale(1.03)}
.ph{position:relative;overflow:hidden;border-radius:var(--r-media);background:var(--placeholder)}
.ph-label{position:absolute;top:14px;left:16px;right:16px;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;line-height:1.4;color:#4a4946}
.cap{position:absolute;left:12px;bottom:12px;max-width:calc(100% - 92px);box-sizing:border-box;display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:var(--r-chip)}
.cap-name{font-size:clamp(17px,1.56vw,20px);font-weight:700;letter-spacing:-0.02em;line-height:1.15}
.cap-sum{font-size:13px;line-height:1.4;color:var(--body)}
.cap-kind{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted)}
.arrow{position:absolute;right:12px;bottom:12px;width:44px;height:44px;box-sizing:border-box;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background-color 200ms var(--ease),color 200ms var(--ease),border-color 200ms var(--ease)}
.card:hover .arrow,.card.is-hover .arrow{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.ix{position:relative;list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.ix-row{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:12px;row-gap:2px;min-height:64px;box-sizing:border-box;padding:18px 0 14px;border-bottom:1px solid var(--hairline);color:var(--ink);text-decoration:none}
.ix-name{display:inline-block;font-size:clamp(18px,1.7vw,22px);font-weight:600;letter-spacing:-0.015em;line-height:1.2;transition:transform 260ms var(--ease)}
.ix-row:hover .ix-name,.ix-row:focus-visible .ix-name,.ix-row.is-hover .ix-name{transform:translateX(8px)}
.ix-kind{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted)}
.ix-prev{position:absolute;z-index:3;width:240px;border-radius:var(--r-media);overflow:hidden;background:var(--placeholder);pointer-events:none;transition:top 260ms var(--ease),left 260ms var(--ease),height 260ms var(--ease),transform 260ms var(--ease),opacity 180ms ease}
@media (hover:none),(max-width:719px){.ix-prev{display:none}}
.foot{position:relative;overflow:hidden;border-radius:20px 20px 0 0;color:var(--ground);padding:clamp(64px,10vw,128px) var(--margin) 12px}
.foot-link{display:inline-flex;align-items:center;min-height:44px;color:var(--ground);text-decoration:none;font-size:14px}
.foot-link:hover{text-decoration:underline;text-underline-offset:4px}
.email{margin:0;padding:0;background:none;border:0;color:var(--ground);font-family:var(--sans);font-size:clamp(34px,8.8vw,112px);font-weight:800;letter-spacing:-0.055em;line-height:0.95;text-align:left;overflow-wrap:anywhere;text-decoration:underline;text-decoration-thickness:0.035em;text-underline-offset:0.12em;cursor:copy}
.icon-btn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;box-sizing:border-box;border-radius:50%;color:inherit;transition:background-color 160ms var(--ease)}
.glass-g.icon-btn:hover{background:rgba(241,240,236,0.32)}
.sheet{padding:clamp(32px,4vw,56px) var(--margin) 0}
.sec{margin-top:clamp(96px,10vw,128px);padding-top:12px;border-top:1px solid var(--ink)}
.sec-head{margin-bottom:var(--gap-s)}
.sec-title{margin:0;font-size:clamp(21px,1.9vw,24px);font-weight:700;letter-spacing:-0.025em;line-height:1.15}
.note{margin:0;font-size:15px;line-height:1.55;color:var(--body)}
.states{display:flex;flex-wrap:wrap;gap:24px 12px}
.state-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:24px 12px}
.state{flex:1 1 260px;min-width:0;margin:0;display:flex;flex-direction:column;gap:10px}
.state-label{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted)}
.frame{position:relative;overflow:hidden;border-radius:14px;background:var(--ground);outline:1px solid var(--outline);outline-offset:-1px}
.ctl{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;box-sizing:border-box;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer}
.ctl:hover{background:rgba(22,22,22,0.06)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0.01ms!important;transition-delay:0s!important;animation-duration:0.01ms!important}}
</style>
</helmet>
<div style="width: 390px; min-height: 13000px; background: #f1f0ec; overflow: hidden">
<dc-import name="Site" hint-size="390px,13000px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":13000}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
