<script type="text/x-dc" data-dc-script data-props='{"reducedMotion":{"editor":"boolean","default":false,"section":"Preview"},"reducedTransparency":{"editor":"boolean","default":false,"section":"Preview"},"$preview":{"width":1280,"height":3500}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { brand: false };
  }
  componentDidMount() {
    if (typeof IntersectionObserver === 'undefined') { this.setState({ brand: true }); return; }
    // The big name lives in the hero, which renders a moment after the page. Watch for it, then observe it.
    const attach = () => {
      const name = document.querySelector('.hx-name');
      if (!name) return false;
      const bar = document.querySelector('.nav-bar');
      const top = bar ? Math.round(bar.getBoundingClientRect().height) : 0;
      this.io = new IntersectionObserver((entries) => {
        const gone = !entries[0].isIntersecting;
        if (gone !== this.state.brand) this.setState({ brand: gone });
      }, { rootMargin: '-' + top + 'px 0px 0px 0px' });
      this.io.observe(name);
      return true;
    };
    if (!attach()) {
      this.mo = new MutationObserver(() => { if (attach()) this.mo.disconnect(); });
      this.mo.observe(document.body, { childList: true, subtree: true });
    }
  }
  componentWillUnmount() {
    if (this.io) this.io.disconnect();
    if (this.mo) this.mo.disconnect();
  }
  renderVals() {
    return {
      brandCls: this.state.brand ? '' : 'brand-off',
      rootClass: [this.props.reducedTransparency ? 'solid' : '', this.props.reducedMotion ? 'still' : ''].join(' ')
    };
  }
}
</script>
