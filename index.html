<html lang="en">

<div id="top" class="root {{rootClass}}" style="font-family: 'Funnel Sans', ui-sans-serif, system-ui, sans-serif; color: #161616">

<div class="frost nav-bar">

<main class="page">

<section aria-label="Introduction" style="padding-top: 4px">
<dc-import name="Hero" hint-size="100%,640px"></dc-import>
</section>

<section aria-label="Selected work" style="margin-top: 12px">
<dc-import name="Projects" view="featured" hint-size="100%,600px"></dc-import>
</section>

<div class="more-row"><a href="Work.dc.html" class="btn-pill"><span class="nudge">View more</span></a></div>

<section class="split gap-w" aria-labelledby="home-about">

<a href="AboutPage.dc.html" class="mono-link">More about me<span aria-hidden="true" style="margin-left: 6px">→</span></a>
</div>
</section>

<section class="gap-w" aria-label="More work">
<dc-import name="Projects" view="index" hint-size="100%,680px"></dc-import>
</section>

</main>

<div class="gap-w"><dc-import name="Footer" hint-size="100%,860px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"reducedMotion":{"editor":"boolean","default":false,"section":"Preview"},"reducedTransparency":{"editor":"boolean","default":false,"section":"Preview"},"$preview":{"width":1280,"height":3500}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rootClass: [this.props.reducedTransparency ? 'solid' : '', this.props.reducedMotion ? 'still' : ''].join(' ')
    };
  }
}
</script>
