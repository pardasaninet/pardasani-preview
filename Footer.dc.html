<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { copied: false };
  }
  componentWillUnmount() {
    clearTimeout(this.copyTimer);
  }
  renderVals() {
    const copy = () => {
      try { navigator.clipboard.writeText('mannat@pardasani.net'); } catch (e) {}
      clearTimeout(this.copyTimer);
      this.setState({ copied: true });
      this.copyTimer = setTimeout(() => this.setState({ copied: false }), 2400);
    };
    return {
      copy,
      copiedText: this.state.copied ? 'Copied' : '',
      copiedOp: this.state.copied ? 1 : 0
    };
  }
}
</script>
