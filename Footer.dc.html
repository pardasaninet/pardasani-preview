<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1000}}'>
// Orphans. text-wrap: pretty misses some cases, so on every page the last two words of each heading, summary,
// statement, paragraph, caption and list item are joined with a non-breaking space. It runs again whenever text re-renders.
const JOIN_SELECTOR = 'h1,h2,h3,h4,p,li,figcaption,dd,blockquote';
function joinLastWords(el) {
  // Two-word text is left free to wrap, so a short label never overflows a narrow column.
  if ((el.textContent || '').trim().split(/[\s\u00a0]+/).length < 3) return;
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {
    acceptNode: (n) => (n.parentElement && n.parentElement.closest('svg') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT)
  });
  let last = null;
  let n;
  while ((n = walker.nextNode())) { if (n.nodeValue.trim()) last = n; }
  if (!last) return;
  const v = last.nodeValue;
  const body = v.replace(/\s+$/, '');
  // Only the last gap is joined. If it's already a non-breaking space, the element is done.
  const k = Math.max(body.lastIndexOf(' '), body.lastIndexOf('\u00a0'));
  if (!(k > 0 && body.charAt(k) === ' ' && body.slice(0, k).trim())) return;
  // A hyphen inside the joined words could still split them ("front-" then "end development."), so it becomes non-breaking too.
  const j = Math.max(body.lastIndexOf(' ', k - 1), body.lastIndexOf('\u00a0', k - 1)) + 1;
  last.nodeValue = body.slice(0, j) + (body.slice(j, k) + '\u00a0' + body.slice(k + 1)).replace(/-/g, '\u2011') + v.slice(body.length);
}
function joinAll() {
  try { document.querySelectorAll(JOIN_SELECTOR).forEach(joinLastWords); } catch (e) {}
}

// Page chrome. Every page imports the footer, so two page-wide states are set here, as classes on the page:
// is-scrolled once the page has scrolled more than 8px (the header's shadow), and at-end while a Next project card
// is on screen (the project bar's Next fills ink).
function setPageClass(name, on) {
  try { document.documentElement.classList.toggle(name, on); } catch (e) {}
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { copied: false };
  }
  componentDidMount() {
    this.joinSoon = () => { cancelAnimationFrame(this.joinRaf); this.joinRaf = requestAnimationFrame(() => { joinAll(); this.watchEnd(); }); };
    this.joinSoon();
    try {
      this.joinObs = new MutationObserver(this.joinSoon);
      this.joinObs.observe(document.body, { childList: true, subtree: true, characterData: true });
    } catch (e) {}
    this.onScroll = () => setPageClass('is-scrolled', (window.scrollY || document.documentElement.scrollTop || 0) > 8);
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.onScroll();
  }
  // The Next project card renders with its page, so it may not exist yet when the footer mounts. This runs again on every change until it does.
  watchEnd() {
    if (this.endObs || typeof IntersectionObserver === 'undefined') return;
    const card = document.querySelector('.card-next');
    if (!card) return;
    this.endObs = new IntersectionObserver((entries) => setPageClass('at-end', entries[0].isIntersecting));
    this.endObs.observe(card);
  }
  componentWillUnmount() {
    clearTimeout(this.copyTimer);
    cancelAnimationFrame(this.joinRaf);
    if (this.joinObs) this.joinObs.disconnect();
    if (this.endObs) this.endObs.disconnect();
    window.removeEventListener('scroll', this.onScroll);
    setPageClass('is-scrolled', false);
    setPageClass('at-end', false);
  }
  renderVals() {
    const copy = () => {
      try { navigator.clipboard.writeText('mannat@pardasani.net'); } catch (e) {}
      clearTimeout(this.copyTimer);
      this.setState({ copied: true });
      this.copyTimer = setTimeout(() => this.setState({ copied: false }), 2400);
    };
    return {
      copy,
      copiedText: this.state.copied ? 'Copied' : '',
      copiedOp: this.state.copied ? 1 : 0
    };
  }
}
</script>
