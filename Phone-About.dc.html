<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@300;400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
:root{--ground:#f1f0ec;--ink:#161616;--body:#3b3a37;--muted:#5f5e5a;--tone2:#85837d;--hairline:#c9c7c0;--tile:#e4e2dc;--surface:#f8f7f3;--placeholder:#d3d1ca;--outline:rgba(22,22,22,0.14);--gradient:radial-gradient(90% 85% at 0% 100%,#b49d91 0%,rgba(180,157,145,0) 62%),radial-gradient(70% 80% at 100% 10%,#74b0df 0%,rgba(116,176,223,0) 65%),radial-gradient(60% 70% at 100% 100%,#8fb9d2 0%,rgba(143,185,210,0) 70%),linear-gradient(135deg,#2456ac 0%,#3f7fc8 45%,#8fb9d2 100%);--gradient-solid:#2c5ea8;--glass-gradient-fill:rgba(241,240,236,0.18);--glass-gradient-line:rgba(241,240,236,0.65);--glass-image-fill:rgba(241,240,236,0.72);--glass-image-line:rgba(255,255,255,0.8);--r-media:20px;--r-chip:14px;--r-pill:999px;--margin:clamp(12px,1.875vw,24px);--gap-t:12px;--gap-s:clamp(24px,3.1vw,40px);--gap-w:clamp(120px,15.6vw,200px);--ease:cubic-bezier(0.2,0.8,0.2,1);--sans:'Funnel Sans',ui-sans-serif,system-ui,sans-serif;--mono:'Antarctican Mono','IBM Plex Mono',ui-monospace,monospace}
.root{min-height:100%;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;text-wrap:pretty;-webkit-font-smoothing:antialiased}
.root h1,.root h2,.root h3,.root h4{text-wrap:balance}
.gradient{background:var(--gradient)}
.glass-g{background:var(--glass-gradient-fill);border:1px solid var(--glass-gradient-line);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);color:var(--ground)}
.glass-i{background:var(--glass-image-fill);border:1px solid var(--glass-image-line);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);color:var(--ink)}
.frost{background:rgba(241,240,236,0.72);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.solid .glass-g,.glass-g.solid{background:var(--gradient-solid);-webkit-backdrop-filter:none;backdrop-filter:none}
.solid .glass-i,.glass-i.solid,.solid .frost,.frost.solid{background:var(--ground);-webkit-backdrop-filter:none;backdrop-filter:none}
@media (prefers-reduced-transparency:reduce){.glass-g{background:var(--gradient-solid);-webkit-backdrop-filter:none;backdrop-filter:none}.glass-i,.frost{background:var(--ground);-webkit-backdrop-filter:none;backdrop-filter:none}}
.grain{position:absolute;inset:0;width:100%;height:100%;opacity:0.04;pointer-events:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.t-label{margin:0;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;line-height:1.35}
.t-kind{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;line-height:1.35}
.t-code{font-family:var(--mono);font-size:12px;letter-spacing:0;text-transform:none}
.t-case{margin:0;font-size:clamp(64px,17vw,218px);font-weight:800;letter-spacing:-0.065em;line-height:0.8}
.t-statement{margin:0;font-size:clamp(24px,2.5vw,32px);font-weight:500;letter-spacing:-0.022em;line-height:1.2}
.tone2{color:var(--tone2)}
.nudge{display:inline-block;transform:translateY(-0.06em)}
.split,.row{display:flex;flex-wrap:wrap;column-gap:12px}
.split{row-gap:var(--gap-s)}
.row{row-gap:12px}
/* Bento grids (project cards, About tiles): 14px gaps, a touch wider than the 12px page grid */
.bento{column-gap:14px;row-gap:14px}
.bento>.c4{width:clamp(calc((100% - 126px) * 0.4 + 42px),calc((720px - 100%) * 999),100%)}
.bento>.c6{width:clamp(calc((100% - 126px) * 0.6 + 70px),calc((720px - 100%) * 999),100%)}
.c2,.c3,.c4,.c5,.c6,.c7{flex:none;min-width:0}
.c4{width:clamp(calc((100% - 108px) * 0.4 + 36px),calc((720px - 100%) * 999),100%)}
.c5{width:clamp(calc((100% - 108px) * 0.5 + 48px),calc((720px - 100%) * 999),100%)}
.c6{width:clamp(calc((100% - 108px) * 0.6 + 60px),calc((720px - 100%) * 999),100%)}
.c10{flex:none;width:100%;min-width:0}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.on-dark a:focus-visible,.on-dark button:focus-visible{outline-color:var(--ground)}
.is-focus{outline:2px solid var(--ink);outline-offset:3px}
.still,.still *{transition-duration:0.01ms!important;transition-delay:0s!important}
.capsule{position:relative;z-index:2;margin:0;max-width:1100px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;column-gap:0.28em;row-gap:10px;font-size:clamp(28px,4.9vw,66px);font-weight:800;letter-spacing:-0.045em;line-height:1}
.cw{display:inline-flex;align-items:center;height:clamp(52px,8vw,104px);box-sizing:border-box;white-space:nowrap}
.cp{padding:0 0.38em;border-radius:999px}
.loop{position:absolute;left:-12%;top:-36%;width:124%;height:172%;overflow:visible;pointer-events:none}
.loop path{transition:stroke-dashoffset 1.4s var(--ease)}
.orbit{position:relative;height:clamp(560px,54vw,700px);display:flex;align-items:center;justify-content:center}
.photo-wrap{position:absolute;z-index:1;transform:translate(-50%,-50%);transition:left 120ms linear,top 120ms linear}
.photo{display:block;width:76px;height:76px;padding:0;border:0;border-radius:50%;background:var(--placeholder);cursor:pointer;transition:transform 280ms var(--ease)}
.photo-cap{position:absolute;left:50%;top:calc(100% + 2px);z-index:3;transform:translateX(-50%);white-space:nowrap;padding:5px 10px;border-radius:999px;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;pointer-events:none}
.photo-row{display:flex;gap:12px;overflow-x:auto;padding:12px 2px 8px;margin-top:20px;scroll-snap-type:x mandatory}
.photo-row .photo{flex:none;scroll-snap-align:start}
.tile{position:relative;box-sizing:border-box;min-height:clamp(320px,30vw,380px);border-radius:var(--r-media);padding:22px}
/* Raised glass edge: the softest shadow underneath and a hairline of light inside the edge, so cards lift off the page without darkening it */
:root{--raise:0 1px 2px rgba(22,22,22,0.05),0 6px 16px -10px rgba(22,22,22,0.12);--raise-in:inset 0 1px 0 rgba(255,255,255,0.55),inset 0 0 0 1px rgba(255,255,255,0.22)}
.card,.tile{box-shadow:var(--raise)}
.card::after,.tile::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:var(--raise-in);pointer-events:none;z-index:5}
.dock{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:14px;padding:12px 14px 10px;border-radius:22px}
.dock-group{display:flex;flex-direction:column;align-items:center;gap:8px}
.dock-icons{display:flex;align-items:flex-end;gap:8px;margin:0;padding:0;list-style:none}
.dock-item{position:relative}
.dock-btn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border:0;border-radius:12px;background:rgba(248,247,243,0.94);color:var(--ink);font-family:var(--mono);font-size:13px;font-weight:500;cursor:pointer;transform-origin:50% 100%;transition:transform 170ms var(--ease)}
.dock-btn.sm{width:40px;height:40px;border-radius:11px}
.dock-div{align-self:stretch;width:1px;margin:2px 0 24px;background:rgba(241,240,236,0.6)}
.dock-tip{position:absolute;left:50%;bottom:calc(100% + 30px);z-index:5;transform:translateX(-50%);display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:var(--r-chip);white-space:nowrap;pointer-events:none;text-align:left}
.lab-card{position:absolute;width:46%;padding:8px;box-sizing:border-box;border-radius:16px;background:var(--surface);border:1px solid var(--outline)}
.fan{position:relative;height:440px}
.fan-card{position:absolute;left:50%;top:40px;width:250px;height:330px;transition:transform 520ms var(--ease)}
.fan.stack{height:auto;display:flex;flex-direction:column;gap:12px}
.fan.stack .fan-card{position:relative;left:auto;top:auto;width:100%;height:auto;min-height:300px;transform:none!important}
.skill{position:relative;width:100%;height:100%;min-height:inherit;box-sizing:border-box;padding:22px;border-radius:var(--r-media);display:flex;flex-direction:column;gap:14px;overflow:hidden}
.skill h3{position:relative;margin:0;font-size:28px;font-weight:800;letter-spacing:-0.03em;line-height:1}
.skill ul{position:relative;list-style:none;margin:0;padding:12px 0 0;border-top:1px solid currentColor;display:flex;flex-direction:column;gap:4px;font-size:15px;line-height:1.4}
.mini-card{position:absolute;left:50%;top:24px;width:125px;height:165px;box-sizing:border-box;padding:10px;border-radius:12px;font-size:14px;font-weight:800;letter-spacing:-0.02em}
.sheet{padding:clamp(32px,4vw,56px) var(--margin) clamp(96px,10vw,140px)}
.sec{margin-top:clamp(96px,10vw,128px);padding-top:12px;border-top:1px solid var(--ink)}
.sec-head{margin-bottom:var(--gap-s)}
.sec-title{margin:0;font-size:clamp(21px,1.9vw,24px);font-weight:700;letter-spacing:-0.025em;line-height:1.15}
.note{margin:0;font-size:15px;line-height:1.55;color:var(--body)}
.states{display:flex;flex-wrap:wrap;gap:24px 12px}
.state{flex:1 1 300px;min-width:0;margin:0;display:flex;flex-direction:column;gap:10px}
.state-label{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted)}
.crop{position:relative;overflow:hidden;border-radius:14px;background:#e9e7e1}
.ctl{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;box-sizing:border-box;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer}
.ctl:hover{background:rgba(22,22,22,0.06)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0.01ms!important;transition-delay:0s!important;animation-duration:0.01ms!important}}
</style>
</helmet>
