<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@300;400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
/* The box: the home gradient window. Everything inside responds to the box's width, not the window's. */
.hx{position:relative;container:hx / inline-size;box-sizing:border-box;display:flex;flex-direction:column;gap:20px;padding:24px;border-radius:20px;overflow:hidden;color:#f1f0ec;font-family:'Funnel Sans',ui-sans-serif,system-ui,sans-serif;background:radial-gradient(90% 85% at 0% 100%,#b49d91 0%,rgba(180,157,145,0) 62%),radial-gradient(70% 80% at 100% 10%,#74b0df 0%,rgba(116,176,223,0) 65%),radial-gradient(60% 70% at 100% 100%,#8fb9d2 0%,rgba(143,185,210,0) 70%),linear-gradient(135deg,#2456ac 0%,#3f7fc8 45%,#8fb9d2 100%)}
.hx-grain{position:absolute;inset:0;width:100%;height:100%;opacity:0.04;pointer-events:none}
.hx-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.hx-name{position:relative;margin:0;line-height:0}

/* Intro and widgets. Phone and tablet: the intro sits above the widgets, both on the left.
   Desktop and laptop: the intro takes the left, the widgets sit on the right, tops lined up. */
.hx-row{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:24px}
.hx-intro{min-width:0;display:flex;flex-direction:column;gap:16px}

/* The widget group: columns stop growing at 160px, rows are shorter than the columns, 14px gaps. Phone 2 by 2, tablet 4 by 2, desktop 3 by 2. */
.hx-grid{flex:none;display:grid;gap:14px;--cell:min((100cqi - 14px) / 2,160px);--row:clamp(96px,calc(var(--cell) * 0.45),120px);grid-template-columns:repeat(2,var(--cell));grid-template-rows:repeat(2,var(--row))}
.hx-music{grid-column:1 / 3;grid-row:1}
.hx-weather{grid-column:1;grid-row:2}
.hx-photo{grid-column:2;grid-row:2}
.hx-logo{display:none}
@container hx (min-width:520px){
.hx-grid{--cell:min((100cqi - 42px) / 4,160px);grid-template-columns:repeat(4,var(--cell))}
.hx-photo{grid-column:3 / 5;grid-row:1 / 3}
.hx-logo{display:flex;grid-column:2;grid-row:2}
}
@container hx (min-width:880px){
.hx-row{flex-direction:row}
.hx-intro{flex:1}
.hx-grid{--cell:min((100cqi - 70px) / 6,160px);grid-template-columns:repeat(3,var(--cell))}
.hx-weather{grid-column:3;grid-row:1}
.hx-logo{grid-column:1;grid-row:2}
.hx-photo{grid-column:2 / 4;grid-row:2}
}

/* Intro text, straight on the gradient over the deep blue on the left */
.hx-statement{margin:0;max-width:34ch;font-size:clamp(24px,2.6cqw,34px);font-weight:500;letter-spacing:-0.022em;line-height:1.2;color:#f1f0ec}
.hx-dim{color:rgba(241,240,236,0.72)}
.hx-body{margin:0;max-width:56ch;font-size:clamp(15px,1.35cqw,17px);line-height:1.55;color:rgba(241,240,236,0.9)}

/* Widgets: light glass with ink text, 20px corners, 16px padding */
.hx-w{position:relative;container-type:size;box-sizing:border-box;min-width:0;min-height:0;padding:16px;border-radius:20px;overflow:hidden;color:#161616;background:rgba(241,240,236,0.72);border:1px solid rgba(255,255,255,0.8);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%)}
.solid .hx-w,.solid .hx-cap{background:#f1f0ec;-webkit-backdrop-filter:none;backdrop-filter:none}
@media (prefers-reduced-transparency:reduce){.hx-w,.hx-cap{background:#f1f0ec;-webkit-backdrop-filter:none;backdrop-filter:none}}
.hx-icon{display:block;flex:none}
/* The raised glass edge from the stylesheet: the softest shadow underneath and a hairline of light inside */
.hx-w,.hx-logo{box-shadow:var(--raise)}
.hx-w::after,.hx-logo::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:var(--raise-in);pointer-events:none}

/* Music: the album art fills the widget's height. Title and artist sit to its right with the Apple Music badge, the controls
   run along the bottom with 44px hit areas over the padding, and the progress is a 2px line on the widget's bottom edge. */
.hx-music{padding:0}
.mw{display:flex;height:100%}
.mw-art{position:relative;flex:none;height:100%;aspect-ratio:1 / 1;overflow:hidden;background:#d3d1ca}
.mw-art img{display:block;width:100%;height:100%;object-fit:cover}
.mw-side{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px 0}
.mw-head{position:relative;min-width:0}
.mw-text{display:flex;flex-direction:column;gap:1px;min-width:0}
.mw-title{margin-right:var(--badge-w,104px);font-size:14px;font-weight:600;letter-spacing:-0.01em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mw-artist{font-size:13px;line-height:1.3;color:#5f5e5a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mw-badge{position:absolute;top:-3px;right:0;display:inline-flex;align-items:center;gap:3px;min-height:24px;padding:0 8px;box-sizing:border-box;border:1px solid #161616;border-radius:999px;color:#161616;font-size:11px;font-weight:600;line-height:1;text-decoration:none;white-space:nowrap}
.mw-badge.has-img{padding:0;border:0}
.mw-badge::before{content:'';position:absolute;inset:-10px -4px}
.mw-badge img{display:block;height:24px;width:auto}
.mw-badge svg{display:block;width:11px;height:11px}
.mw-badge:focus-visible{outline:2px solid #161616;outline-offset:2px}
.mw-ctrls{display:flex;align-items:center;justify-content:space-between;height:28px;margin:0 -8px 8px}
.mw-btn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin:-8px 0;padding:0;border:0;border-radius:999px;background:transparent;color:#7e7c78;cursor:pointer;transition:background-color 160ms cubic-bezier(0.2,0.8,0.2,1)}
/* Controls are filled glyphs in the lightest grey that still reads at 3:1 on the glass. Shuffle, a line icon, sits in a grey circle while it's on. */
.mw-btn:hover{background:rgba(22,22,22,0.08)}
.mw-btn.on{background:radial-gradient(circle,#7e7c78 0 15px,transparent 15.5px);color:#f1f0ec}
.mw-btn:focus-visible{outline:2px solid #161616;outline-offset:1px}
.mw-bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(22,22,22,0.12)}
.mw-fill{display:block;height:100%;background:#161616}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* Weather: its own component (Weather.dc.html), filling the square cell */
.hx-weather{min-width:0;min-height:0}

/* Photo: fills the widget, anchored low so the skyline and the water stay in the band. A glass caption shows only once there is caption text. */
.hx-photo{padding:0;border:0}
.hx-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 80%}
.hx-cap{position:absolute;left:16px;bottom:16px;max-width:calc(100% - 32px);box-sizing:border-box;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.3;color:#161616;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(241,240,236,0.72);border:1px solid rgba(255,255,255,0.8);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%)}

/* Logo: the mark on its cream rounded square, read as an app icon */
.hx-logo{position:relative;align-items:center;justify-content:center;border-radius:20px;background:#f1f0ec}
.hx-logo img{display:block;width:56px;height:auto}
</style>

</div>

</div>
</div>

</div>

<div class="hx-weather"><dc-import name="Weather" weather="{{weather}}" night="{{night}}" layout="wide" style="display: block; width: 100%; height: 100%" hint-size="100%,100%"></dc-import></div>

</figure>

<script type="text/x-dc" data-dc-script data-props='{"music":{"editor":"enum","options":["rest","playing"],"default":"rest","section":"Preview"},"weather":{"editor":"enum","options":["auto","loading","failed","sunny","cloudy","rainy","snowy"],"default":"auto","section":"Preview"},"night":{"editor":"enum","options":["no","yes"],"default":"no","section":"Preview"},"$preview":{"width":1280,"height":560}}'>
// Music: my playlist, "la di da" on Apple Music. Add a song by adding a row, in playlist order.
// A website can't stream full songs from Apple Music without the visitor signing in, so the widget looks each song up
// on Apple's iTunes Search API (no key needed) and plays Apple's 30-second preview.
const PLAYLIST_NAME = 'la di da';
const PLAYLIST_URL = 'https://music.apple.com/us/playlist/la-di-da/pl.u-zPyLAb6uZMJgmoX';
const SONGS = [
  { title: "I'm This", artist: 'Peter Cat Recording Co.', album: 'Bismillah' },
  { title: 'A Love International', artist: 'Khruangbin', album: 'A LA SALA' },
  { title: 'Real Life', artist: 'The Marías', album: 'Submarine' },
  { title: 'Waterfall', artist: 'Babe Rainbow', album: 'Acid and Honey' },
  { title: 'Girls On Film', artist: 'Duran Duran', album: 'Duran Duran (Deluxe Edition)' },
  { title: 'Separate Ways', artist: 'Eyedress', album: 'Stoner' },
  { title: 'Kinky Love', artist: 'Pale Saints', album: 'Flesh Balloon - EP' },
  { title: 'Floated By', artist: 'Peter Cat Recording Co.', album: 'Bismillah' },
  { title: 'August 10', artist: 'Khruangbin', album: 'Con Todo El Mundo' },
  { title: 'Suddenly', artist: 'Peter Cat Recording Co.', album: 'Beta' },
  { title: 'Loser', artist: 'Tame Impala', album: 'Deadbeat' },
  { title: 'You Mean Well', artist: 'Begum', album: 'Are You Ok?' },
  { title: 'Raj D-Minor', artist: 'Begum', album: 'Bagh' }
];
// Apple's official "Listen on Apple Music" badge, as an uploaded image url. Until it's added, the link shows as a small text pill.
const BADGE_SRC = '';
// The exported site always fetches. (In the design canvas this was limited, because the canvas blocks network calls.)
const LIVE = true;

function plain(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }
function bare(s) { return plain(s).replace(/\s*[([].*?[)\]]/g, '').trim(); }
let jsonpCount = 0;
// If the browser blocks the request, the same search runs as JSONP.
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const name = 'laDiDa' + (++jsonpCount);
    const el = document.createElement('script');
    const timer = setTimeout(() => finish(null), 8000);
    function finish(data) { clearTimeout(timer); try { delete window[name]; } catch (e) {} el.remove(); data ? resolve(data) : reject(new Error('No response')); }
    window[name] = finish;
    el.onerror = () => finish(null);
    el.src = url + '&callback=' + name;
    document.head.appendChild(el);
  });
}
function search(song) {
  const term = encodeURIComponent(song.title + ' ' + song.artist).replace(/%20/g, '+');
  const url = 'https://itunes.apple.com/search?term=' + term + '&entity=song&limit=5&country=us';
  return fetch(url).then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).catch(() => jsonp(url));
}
// The first result by the right artist (ignoring case and accents) with a preview, preferring the exact title, then the album.
function pick(song, data) {
  const hits = ((data && data.results) || []).filter((r) => plain(r.artistName) === plain(song.artist) && r.previewUrl);
  if (!hits.length) return null;
  const score = (r) => (plain(r.trackName) === plain(song.title) ? 4 : 0) + (plain(r.collectionName) === plain(song.album) ? 2 : 0) + (bare(r.trackName) === bare(song.title) ? 1 : 0);
  const r = hits.reduce((best, h) => (score(h) > score(best) ? h : best), hits[0]);
  return { title: r.trackName, artist: r.artistName, cover: String(r.artworkUrl100 || '').replace('100x100', '600x600'), src: r.previewUrl };
}
const lookups = {};
function lookUp(i) {
  if (!lookups[i]) lookups[i] = search(SONGS[i]).then((d) => pick(SONGS[i], d)).catch(() => null);
  return lookups[i];
}

// Photo. The wide crop (1600 x 800) is for the wide widget, the square one (1200 x 1200) for the large one on tablets.
// The widget's own shape picks one, so only that one downloads. The glass caption stays off until caption has text.
const PHOTO = {
  wide: 'assets/home-photo-wide.jpg',
  square: 'assets/home-photo-square.jpg',
  alt: 'A city skyline at golden hour, seen from the water.',
  caption: ''
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    // The "playing" preview starts with shuffle on. Nothing plays until someone presses play.
    const order = SONGS.map((_, i) => i);
    const demo = props.music === 'playing';
    this.state = { order, pos: 0, playing: false, shuffle: demo, t: 0, dur: 30, tracks: {}, status: LIVE ? 'loading' : 'failed', shape: '' };
    this.photoId = 'hx-photo-' + Math.random().toString(36).slice(2, 9);
  }
  componentDidMount() {
    this.watchPhoto();
    // On page load, only the first song is looked up, so the widget shows its artwork, title and artist at rest.
    if (LIVE) this.settle(0, 1).then((pos) => { if (!this.gone) this.setState(pos < 0 ? { status: 'failed' } : { status: 'ready', pos }); });
  }
  componentWillUnmount() {
    this.gone = true;
    if (this.photoRO) this.photoRO.disconnect();
    if (this.audio) { this.audio.pause(); this.audio.removeAttribute('src'); }
  }
  // Wide when the widget is about twice as wide as it is tall, square otherwise. Follows the widget if it changes shape.
  watchPhoto() {
    let el = null;
    try { el = document.getElementById(this.photoId); } catch (e) {}
    if (!el || typeof ResizeObserver === 'undefined') { this.setState({ shape: 'wide' }); return; }
    this.photoRO = new ResizeObserver((entries) => {
      const r = entries[0].contentRect;
      if (!r.width || !r.height) return;
      const shape = r.width > r.height * 1.4 ? 'wide' : 'square';
      if (shape !== this.state.shape) this.setState({ shape });
    });
    this.photoRO.observe(el);
  }
  // From a position in the play order, finds the next song with a preview, skipping any with no match. -1 if none has one.
  settle(pos, dir) {
    const n = SONGS.length;
    const tryAt = (k, tries) => {
      if (tries >= n) return Promise.resolve(-1);
      const p = ((k % n) + n) % n;
      const i = this.state.order[p];
      return lookUp(i).then((track) => {
        if (this.gone) return -1;
        this.setState({ tracks: Object.assign({}, this.state.tracks, { [i]: track || false }) });
        return track ? p : tryAt(p + dir, tries + 1);
      });
    };
    return tryAt(pos, 0);
  }
  ensureAudio() {
    if (this.audio) return this.audio;
    const a = new Audio();
    a.preload = 'none';
    a.addEventListener('timeupdate', () => this.setState({ t: a.currentTime, dur: a.duration || 30 }));
    a.addEventListener('ended', () => this.step(1, true));
    a.addEventListener('error', () => { if (this.state.playing) this.step(1, true); });
    this.audio = a;
    return a;
  }
  // The audio source is only set when someone presses play, so nothing downloads before that.
  start(fromStart) {
    const i = this.state.order[this.state.pos];
    const track = this.state.tracks[i];
    if (!track) return;
    const a = this.ensureAudio();
    if (a.getAttribute('src') !== track.src) { a.src = track.src; this.setState({ t: 0 }); }
    else if (fromStart) a.currentTime = 0;
    const p = a.play();
    if (p && p.catch) p.catch(() => this.setState({ playing: false }));
    // While this song plays, the next one is looked up.
    lookUp(this.state.order[(this.state.pos + 1) % SONGS.length]);
  }
  play() {
    if (this.state.status !== 'ready') return;
    this.setState({ playing: true });
    this.start(false);
  }
  pause() {
    if (this.audio) this.audio.pause();
    this.setState({ playing: false });
  }
  // Previous and next skip songs. When a preview ends, the next song starts. Songs without a preview are skipped.
  step(dir, keepPlaying) {
    const playing = keepPlaying || this.state.playing;
    if (this.audio) this.audio.pause();
    const seq = (this.seq || 0) + 1;
    const target = this.state.pos + dir;
    this.seq = seq;
    this.setState({ pos: (target + SONGS.length) % SONGS.length, t: 0, dur: 30, playing });
    this.settle(target, dir).then((pos) => {
      if (this.gone || seq !== this.seq) return;
      if (pos < 0) { this.setState({ status: 'failed', playing: false }); return; }
      this.setState({ pos });
      if (playing) this.start(true);
    });
  }
  toggleShuffle() {
    const current = this.state.order[this.state.pos];
    if (!this.state.shuffle) {
      const rest = SONGS.map((_, i) => i).filter((i) => i !== current);
      for (let i = rest.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const x = rest[i]; rest[i] = rest[j]; rest[j] = x;
      }
      this.setState({ shuffle: true, order: [current].concat(rest), pos: 0 });
    } else {
      this.setState({ shuffle: false, order: SONGS.map((_, i) => i), pos: current });
    }
  }
  renderVals() {
    const s = this.state;
    const i = s.order[s.pos];
    const found = s.tracks[i];
    const ready = s.status === 'ready';
    // If nothing loads, the widget shows the playlist name with the badge. It never shows placeholder text.
    const track = s.status === 'failed' ? { title: PLAYLIST_NAME, artist: '', cover: '' }
      : found ? found : { title: SONGS[i].title, artist: SONGS[i].artist, cover: '' };
    return {
      track,
      ready,
      playing: s.playing,
      paused: !s.playing,
      playLabel: s.playing ? 'Pause' : 'Play',
      toggle: () => (this.state.playing ? this.pause() : this.play()),
      prev: () => this.step(-1, false),
      next: () => this.step(1, false),
      shuffleCls: s.shuffle ? 'on' : '',
      shufflePressed: s.shuffle ? 'true' : 'false',
      toggleShuffle: () => this.toggleShuffle(),
      pct: Math.min(100, Math.round((s.t / (s.dur || 30)) * 1000) / 10),
      badge: { href: PLAYLIST_URL, src: BADGE_SRC, noSrc: !BADGE_SRC, cls: BADGE_SRC ? 'has-img' : '' },
      weather: this.props.weather || 'auto',
      night: this.props.night || 'no',
      photo: { id: this.photoId, src: s.shape ? PHOTO[s.shape] : '', alt: PHOTO.alt, caption: PHOTO.caption }
    };
  }
}
</script>
</body>
</html>
