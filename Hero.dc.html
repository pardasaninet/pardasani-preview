<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@300;400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
/* The box: the home gradient window. Everything inside responds to the box's width, not the window's. */
.hx{position:relative;container:hx / inline-size;box-sizing:border-box;display:flex;flex-direction:column;gap:20px;padding:24px;border-radius:20px;overflow:hidden;color:#f1f0ec;font-family:'Funnel Sans',ui-sans-serif,system-ui,sans-serif;background:radial-gradient(90% 85% at 0% 100%,#b49d91 0%,rgba(180,157,145,0) 62%),radial-gradient(70% 80% at calc(100% + var(--hx-dx, 0%)) calc(10% + var(--hx-dy, 0%)),#74b0df 0%,rgba(116,176,223,0) 65%),radial-gradient(60% 70% at 100% 100%,#8fb9d2 0%,rgba(143,185,210,0) 70%),linear-gradient(135deg,#2456ac 0%,#3f7fc8 45%,#8fb9d2 100%);transition:--hx-dx 1600ms var(--ease),--hx-dy 1600ms var(--ease)}
/* The light spot (top right) drifts slowly toward the pointer, by up to 4% of the box, and eases back when the pointer leaves */
@property --hx-dx{syntax:'<percentage>';inherits:false;initial-value:0%}
@property --hx-dy{syntax:'<percentage>';inherits:false;initial-value:0%}
.hx-grain{position:absolute;inset:0;width:100%;height:100%;opacity:0.04;pointer-events:none}
.hx-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.hx-name{position:relative;margin:0;line-height:0}

/* Intro and widgets. Phone and tablet: the intro sits above the widgets, both on the left.
   Desktop and laptop: the intro takes the left, the widgets sit on the right, tops lined up. */
/* The widget group's sizes are set on the row, so the dock can line up with the widgets' second row. */
.hx-row{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:24px;--cell:min((100cqi - 14px) / 2,160px);--row:clamp(96px,calc(var(--cell) * 0.45),120px)}
.hx-intro{min-width:0;display:flex;flex-direction:column;gap:16px}

/* The widget group: columns stop growing at 160px, rows are shorter than the columns, 14px gaps. Phone 2 by 2, tablet 4 by 2, desktop 3 by 2. */
.hx-grid{flex:none;display:grid;gap:14px;grid-template-columns:repeat(2,var(--cell));grid-template-rows:repeat(2,var(--row))}
.hx-music{grid-column:1 / 3;grid-row:1}
.hx-weather{grid-column:1;grid-row:2}
.hx-photo{grid-column:2;grid-row:2}
.hx-logo{display:none}
/* The Toolkit dock from About. Phone and tablet: after the widgets, full width, icons wrapping onto a second row if they don't fit. */
.hx-dock{position:relative;align-self:stretch;min-width:0}
.hx-dock .dock{width:100%}
@container hx (min-width:520px){
.hx-row{--cell:min((100cqi - 42px) / 4,160px)}
.hx-grid{grid-template-columns:repeat(4,var(--cell))}
.hx-photo{grid-column:3 / 5;grid-row:1 / 3}
.hx-logo{display:flex;grid-column:2;grid-row:2}
}
/* Desktop and laptop: the intro on the left over the widgets' first row, the dock under it, bottom-left, level with the second row.
   The rows are the widget rows, so the hero is no taller than the widgets. */
@container hx (min-width:880px){
.hx-row{--cell:min((100cqi - 70px) / 6,160px);display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:var(--row) var(--row);column-gap:24px;row-gap:14px}
.hx-intro{grid-column:1;grid-row:1}
.hx-grid{grid-column:2;grid-row:1 / 3;grid-template-columns:repeat(3,var(--cell))}
.hx-dock{grid-column:1;grid-row:2;align-self:end;justify-self:start}
.hx-dock .dock{width:max-content}
.hx-weather{grid-column:3;grid-row:1}
.hx-logo{grid-column:1;grid-row:2}
.hx-photo{grid-column:2 / 4;grid-row:2}
}

/* Intro text, straight on the gradient over the deep blue on the left */
.hx-statement{margin:0;max-width:42ch;font-size:clamp(24px,2.6cqw,34px);font-weight:500;letter-spacing:-0.022em;line-height:1.2;color:#f1f0ec}
.hx-dim{color:rgba(241,240,236,0.72)}
.hx-body{margin:0;max-width:56ch;font-size:clamp(15px,1.35cqw,17px);line-height:1.55;color:rgba(241,240,236,0.9)}

/* Widgets: light glass with ink text, 20px corners, 16px padding */
.hx-w{position:relative;container-type:size;box-sizing:border-box;min-width:0;min-height:0;padding:16px;border-radius:20px;overflow:hidden;color:#161616;background:rgba(241,240,236,0.72);border:1px solid rgba(255,255,255,0.8);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%)}
.solid .hx-w{background:#f1f0ec;-webkit-backdrop-filter:none;backdrop-filter:none}
@media (prefers-reduced-transparency:reduce){.hx-w{background:#f1f0ec;-webkit-backdrop-filter:none;backdrop-filter:none}}
.hx-icon{display:block;flex:none}
/* The raised glass edge from the stylesheet: the softest shadow underneath and a hairline of light inside */
.hx-w,.hx-logo,.mw-card{box-shadow:var(--raise)}
.hx-w::after,.hx-logo::after,.mw-card::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:var(--raise-in);pointer-events:none;z-index:2}

/* Hover, as on the project cards: the whole widget grows to 1.03 over the cards' 520ms, with a light ring. Nothing inside zooms on its own.
   Only where there's a real pointer, so touch screens don't get stuck in a hover. With reduced motion only the ring shows. */
.hx-hov,.hx-dock .dock{position:relative;border-radius:20px;outline:2px solid rgba(255,255,255,0);outline-offset:0;transition:transform 520ms var(--ease),outline-color 200ms var(--ease)}
.hx-dock .dock{border-radius:22px}
@media (hover:hover){
.hx-hov:hover,.hx-dock .dock:hover{transform:scale(1.03);outline-color:rgba(255,255,255,0.7);z-index:3}
.hx-music:hover .mw-link{background:#161616}
}
@media (hover:hover) and (prefers-reduced-motion:reduce){.hx-hov:hover,.hx-dock .dock:hover{transform:none}}
.still .hx-hov:hover,.still .hx-dock .dock:hover{transform:none}

/* The flip, shared by the music and weather widgets: a 500ms turn on the vertical axis. The faces swap as the card passes edge-on,
   which with this curve is 65ms in. The back face is mirrored once more so it reads the right way round. With reduced motion the faces crossfade. */
.hx-card{position:relative;display:block;width:100%;height:100%;box-sizing:border-box;border-radius:20px;transform:perspective(900px) rotateY(0deg);transition:transform 500ms var(--ease)}
.hx-card.is-flipped{transform:perspective(900px) rotateY(180deg)}
.hx-face{position:absolute;inset:0;border-radius:inherit;overflow:hidden;transition:visibility 0s linear 65ms}
.hx-back{transform:scaleX(-1)}
.hx-card.is-flipped .hx-front,.hx-card:not(.is-flipped) .hx-back{visibility:hidden}
@media (prefers-reduced-motion:reduce){
.hx-card,.hx-card.is-flipped{transform:none}
.hx-back{transform:none}
.hx-card .hx-face{transition:opacity 300ms var(--ease),visibility 300ms!important}
.hx-card.is-flipped .hx-front,.hx-card:not(.is-flipped) .hx-back{opacity:0}
}
.still .hx-card,.still .hx-card.is-flipped,.still .hx-back{transform:none}
.still .hx-card .hx-face{transition:opacity 300ms var(--ease),visibility 300ms!important}
.still .hx-card.is-flipped .hx-front,.still .hx-card:not(.is-flipped) .hx-back{opacity:0}

/* Music: the album art fills the widget's height. Title and artist sit to its right, a progress bar runs under them,
   and the controls run along the bottom with 44px hit areas over the padding. The Apple Music link is a small arrow in the top right corner.
   The glass takes a 25% tint from the album art (set by the script), changing over 600ms. */
.hx-music{min-width:0;min-height:0}
.mw-card{color:#161616;background:var(--mw-bg,rgba(241,240,236,0.72));border:1px solid rgba(255,255,255,0.8);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);transition:transform 500ms var(--ease),background-color 600ms var(--ease)}
.solid .mw-card{background:var(--mw-solid,#f1f0ec);-webkit-backdrop-filter:none;backdrop-filter:none}
@media (prefers-reduced-transparency:reduce){.mw-card{background:var(--mw-solid,#f1f0ec);-webkit-backdrop-filter:none;backdrop-filter:none}}
.mw{display:flex;height:100%}
/* The art is a button: it flips the widget to the track list */
.mw-art{position:relative;flex:none;height:100%;aspect-ratio:1 / 1;overflow:hidden;margin:0;padding:0;border:0;background:#d3d1ca;cursor:pointer}
.mw-art img{display:block;width:100%;height:100%;object-fit:cover}
.mw-art:focus-visible{outline:2px solid #161616;outline-offset:-4px}
.mw-side{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px 0}
.mw-head{position:relative;min-width:0}
.mw-text{display:flex;flex-direction:column;gap:1px;min-width:0;padding-right:22px}
.mw-title{font-size:14px;font-weight:600;letter-spacing:-0.01em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mw-artist{font-size:13px;line-height:1.3;color:#383734;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* The link: a white arrow on a grey dot, the same grey as the controls, with a 44px hit area */
.mw-link{position:absolute;top:8px;right:8px;z-index:1;display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:999px;background:#52514d;color:#ffffff;transition:background-color 160ms cubic-bezier(0.2,0.8,0.2,1)}
.mw-link::before{content:'';position:absolute;inset:-11px}
.mw-link:hover{background:#3b3a37}
.mw-link svg{display:block;width:12px;height:12px}
.mw-link:focus-visible{outline:2px solid #161616;outline-offset:2px}
.mw-prog{display:block;height:4px;border-radius:999px;background:rgba(22,22,22,0.12);overflow:hidden}
.mw-fill{display:block;height:100%;border-radius:inherit;background:#161616;transition:width 250ms linear}
.mw-ctrls{display:flex;align-items:center;justify-content:space-between;height:28px;margin:0 -8px 8px}
.mw-btn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin:-8px 0;padding:0;border:0;border-radius:999px;background:transparent;color:#52514d;cursor:pointer;transition:background-color 160ms cubic-bezier(0.2,0.8,0.2,1)}
/* The artist line and the controls are dark enough that the glass can take a 25% tint from any of the playlist's covers,
   even the black one, and the artist line still reads at 4.5:1 and the controls at 3:1. */
.mw-btn:hover{background:rgba(22,22,22,0.08)}
.mw-btn:focus-visible{outline:2px solid #161616;outline-offset:1px}
@media (prefers-reduced-motion:reduce){.mw-fill{transition:none}}
/* The back: the art as a small button that flips back, and the playlist, one song per line, scrolling inside the widget */
.mw-back{display:flex;gap:6px;padding:6px}
.mw-thumb{flex:none;width:44px;height:44px;margin:0;padding:0;border:0;border-radius:10px;overflow:hidden;background:#d3d1ca;cursor:pointer}
.mw-thumb img{display:block;width:100%;height:100%;object-fit:cover}
.mw-thumb:focus-visible{outline:2px solid #161616;outline-offset:2px}
.mw-list{flex:1;min-width:0;margin:0;padding:0;list-style:none;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.mw-row{display:flex;align-items:center;gap:6px;width:100%;min-height:44px;margin:0;padding:0 8px;box-sizing:border-box;border:0;border-radius:10px;background:transparent;color:#161616;font:inherit;font-size:13px;line-height:1.25;text-align:left;cursor:pointer;transition:background-color 160ms var(--ease)}
.mw-row:hover{background:rgba(22,22,22,0.08)}
.mw-row:focus-visible{outline:2px solid #161616;outline-offset:-2px}
.mw-row-text{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mw-row-t{font-weight:600}
.mw-row-a{color:#383734}
.mw-row svg{display:block;flex:none;width:10px;height:10px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* Weather: its own component (Weather.dc.html), filling the cell. The whole widget is a button that flips to the time in New York. */
.hx-weather{min-width:0;min-height:0}
.wx-card{margin:0;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.wx-card .sc-host{width:100%;height:100%}
.wx-card:focus-visible{outline:2px solid #f1f0ec;outline-offset:3px}
.wx-back{box-sizing:border-box;display:flex;align-items:flex-end;padding:12px;border:1px solid rgba(255,255,255,0.35);background:linear-gradient(180deg,#1b5ba8,#3a72b8);color:#ffffff;box-shadow:var(--raise)}
.wx-now{margin:0;font-size:15px;font-weight:600;letter-spacing:-0.01em;line-height:1.25}

/* Photo: a button that moves to the next photo with a 400ms crossfade. Each photo fills the widget around its own focal point. */
.hx-photo{padding:0;border:0;margin:0;font:inherit;color:inherit;cursor:pointer}
.hx-photo:focus-visible{outline:2px solid #f1f0ec;outline-offset:3px}
.hx-ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 400ms var(--ease)}
.hx-ph.is-on{opacity:1}

/* Logo: the mark on its cream rounded square, read as an app icon. On hover the tile fills with the site's gradient and the linework turns white, over 520ms. */
.hx-logo{position:relative;align-items:center;justify-content:center;border-radius:20px;background:#f1f0ec;overflow:hidden}
.hx-logo::before{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--gradient);opacity:0;transition:opacity 520ms var(--ease)}
.hx-logo img{position:relative;z-index:1;display:block;width:auto;height:92%;max-width:92%;transition:filter 520ms var(--ease)}
@media (hover:hover){
.hx-logo:hover::before{opacity:1}
.hx-logo:hover img{filter:brightness(0) invert(1)}
}
</style>
</helmet>
<div class="hx" onMouseMove="{{drift}}" onMouseLeave="{{driftBack}}">
<svg width="0" height="0" aria-hidden="true" style="position: absolute"><filter id="grain-hero" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter></svg>
<svg class="hx-grain" aria-hidden="true"><rect width="100%" height="100%" filter="url(#grain-hero)"></rect></svg>
<h1 class="hx-name"><span class="hx-sr">mannat pardasani</span><svg viewBox="70 -849 8719 1089" width="100%" aria-hidden="true" style="display: block; overflow: visible"><text x="0" y="0" font-size="1200" textLength="8850" lengthAdjust="spacing" font-family="Funnel Sans, ui-sans-serif, sans-serif" font-weight="800" fill="#f1f0ec">mannat pardasani</text></svg></h1>

<div class="hx-row">

<div class="hx-intro">
<p class="hx-statement">I'm a design engineer working across product, user experience and visual strategy. <span class="hx-dim">I have a B.S. and a B.F.A. from Purdue.</span></p>
</div>

<div class="hx-grid">

<div class="hx-music hx-hov" id="{{musicId}}" role="group" aria-label="Music player" onKeyDown="{{musicKey}}">

<div class="hx-face hx-front">
<div class="mw">
<button type="button" class="mw-art" id="{{artId}}" aria-label="Show the track list" aria-expanded="{{listOpen}}" onClick="{{openList}}"><sc-if value="{{track.cover}}" hint-placeholder-val="{{ false }}"><img src="{{track.cover}}" alt="" width="600" height="600"></sc-if></button>
<div class="mw-side">

</div>
<sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">

</sc-if>
<sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
<div class="mw-ctrls">

<button type="button" class="mw-btn" aria-label="Previous track" onClick="{{prev}}"><svg class="hx-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 20L9 12l10-8v16ZM5 19V5"></path></svg></button>
<button type="button" class="mw-btn" aria-label="{{playLabel}}" onClick="{{toggle}}"><sc-if value="{{playing}}" hint-placeholder-val="{{ false }}"><svg class="hx-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h4v16h-4zM6 4h4v16H6z"></path></svg></sc-if><sc-if value="{{paused}}" hint-placeholder-val="{{ true }}"><svg class="hx-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l14 9-14 9V3Z"></path></svg></sc-if></button>
<button type="button" class="mw-btn" aria-label="Next track" onClick="{{next}}"><svg class="hx-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4l10 8-10 8V4ZM19 5v14"></path></svg></button>
</div>
</sc-if>
</div>
</div>
<a href="{{playlistUrl}}" target="_blank" rel="noopener" class="mw-link" aria-label="Listen on Apple Music (opens in a new tab)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10M7 17 17 7"></path></svg></a>
</div>
<div class="hx-face hx-back mw-back">
<button type="button" class="mw-thumb" id="{{thumbId}}" aria-label="Hide the track list" onClick="{{closeList}}"><sc-if value="{{track.cover}}" hint-placeholder-val="{{ false }}"><img src="{{track.cover}}" alt="" width="600" height="600"></sc-if></button>
<ul class="mw-list" id="{{listId}}" aria-label="Track list">
<sc-for list="{{songs}}" as="s" hint-placeholder-count="13">
<li><button type="button" class="mw-row" id="{{s.id}}" aria-current="{{s.current}}" onClick="{{s.play}}"><sc-if value="{{s.isCurrent}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 3l14 9-14 9V3Z"></path></svg></sc-if><span class="mw-row-text"><span class="mw-row-t">{{s.title}}</span> <span class="mw-row-a">{{s.artist}}</span></span></button></li>
</sc-for>
</ul>
</div>
</div>
</div>

<div class="hx-weather hx-hov">
<button type="button" class="hx-card wx-card {{wxFlipCls}}" onClick="{{flipWeather}}">
<span class="hx-face hx-front"><dc-import name="Weather" weather="{{weather}}" night="{{night}}" layout="wide" style="display: block; width: 100%; height: 100%" hint-size="100%,100%"></dc-import></span>
<span class="hx-face hx-back wx-back"><span class="wx-now">{{nyNow}}</span></span>
</button>
</div>

<button type="button" class="hx-w hx-photo hx-hov" id="{{photoId}}" onClick="{{nextPhoto}}">
<sc-if value="{{layerA.src}}" hint-placeholder-val="{{ true }}"><img class="hx-ph {{layerA.cls}}" src="{{layerA.src}}" alt="{{layerA.alt}}" aria-hidden="{{layerA.hidden}}" style="object-position: {{layerA.pos}}" decoding="async"></sc-if>
<sc-if value="{{layerB.src}}" hint-placeholder-val="{{ false }}"><img class="hx-ph {{layerB.cls}}" src="{{layerB.src}}" alt="{{layerB.alt}}" aria-hidden="{{layerB.hidden}}" style="object-position: {{layerB.pos}}" decoding="async"></sc-if>
</button>

<div class="hx-logo hx-hov"><img src="assets/logo-14.svg" alt="" width="56" height="56"></div>

</div>

</div>

const PLAYLIST_URL = 'https://music.apple.com/us/playlist/la-di-da/pl.u-zPyLAb6uZMJgmoX';
const SONGS = [
