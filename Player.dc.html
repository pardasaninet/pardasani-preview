<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
<title>Now playing</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="assets/v4.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@300;400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
/* Now playing widget, in iOS medium-widget proportions (360 by 169), on the site's gradient glass with its 20px and 14px corners */
.npw{position:relative;display:flex;align-items:stretch;gap:16px;width:360px;max-width:100%;height:169px;box-sizing:border-box;padding:12px;border-radius:20px;background:rgba(241,240,236,0.18);border:1px solid rgba(241,240,236,0.65);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);color:#f1f0ec;font-family:'Funnel Sans',ui-sans-serif,system-ui,sans-serif}
.npw-art{flex:none;aspect-ratio:1/1;height:100%;border-radius:14px;background:#d3d1ca}
.npw-side{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:2px}
.npw-note{position:absolute;top:2px;right:2px;display:block}
.npw-title{max-width:100%;font-size:17px;font-weight:600;letter-spacing:-0.015em;line-height:1.25;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npw-artist{max-width:100%;margin-top:2px;font-size:15px;font-weight:500;line-height:1.3;text-align:center;color:rgba(241,240,236,0.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npw-controls{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:10px}
.npw-btn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border:0;border-radius:999px;background:transparent;color:inherit;cursor:pointer;transition:background-color 160ms cubic-bezier(0.2,0.8,0.2,1)}
.npw-btn:hover{background:rgba(241,240,236,0.18)}
.npw-btn:focus-visible{outline:2px solid #f1f0ec;outline-offset:2px}
.npw-btn svg{display:block}
@media (max-width:419px){.npw{gap:12px}.npw-title{font-size:16px}.npw-artist{font-size:14px}}
.solid .npw,.npw.solid{background:#2c5ea8;-webkit-backdrop-filter:none;backdrop-filter:none}
@media (prefers-reduced-transparency:reduce){.npw{background:#2c5ea8;-webkit-backdrop-filter:none;backdrop-filter:none}}
</style>
</helmet>
<div class="{{wrapCls}}" style="padding: {{wrapPad}}; border-radius: 20px">
<div class="npw" role="group" aria-label="Now playing">
<span class="npw-art" aria-hidden="true"></span>
<div class="npw-side">
<svg class="npw-note" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 4.6l11-2.6v13.2a3.1 3.1 0 1 1-2-2.9V7.2l-7 1.7v8.3a3.1 3.1 0 1 1-2-2.9z"></path></svg>
<span class="npw-title">{{title}}</span>
<span class="npw-artist">{{artist}}</span>
<div class="npw-controls">
<button type="button" class="npw-btn" aria-label="Previous" onClick="{{prev}}"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.5 6v12L3 12zM21 6v12l-8.5-6z"></path></svg></button>
<button type="button" class="npw-btn" aria-label="{{playLabel}}" onClick="{{togglePlay}}"><sc-if value="{{playing}}" hint-placeholder-val="{{ true }}"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.5 4h3.5v16H6.5zM14 4h3.5v16H14z"></path></svg></sc-if><sc-if value="{{paused}}" hint-placeholder-val="{{ false }}"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg></sc-if></button>
<button type="button" class="npw-btn" aria-label="Next" onClick="{{next}}"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 6v12l8.5-6zM12.5 6v12L21 12z"></path></svg></button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg":{"editor":"enum","options":["gradient","none"],"default":"gradient"},"$preview":{"width":1280,"height":240}}'>
// The track shown. Change these two lines to show a different song.
const TRACK = { title: 'Here Comes the Sun', artist: 'The Beatles' };

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { playing: true };
  }
  renderVals() {
    // No audio plays. The buttons switch between playing and paused.
    const playing = this.state.playing;
    const framed = (this.props.bg || 'gradient') === 'gradient';
    return {
      wrapCls: framed ? 'gradient' : '',
      wrapPad: framed ? '32px' : '0',
      title: TRACK.title,
      artist: TRACK.artist,
      playing,
      paused: !playing,
      playLabel: playing ? 'Pause' : 'Play',
      togglePlay: () => this.setState({ playing: !playing }),
      prev: () => this.setState({ playing: true }),
      next: () => this.setState({ playing: true })
    };
  }
}
</script>
</body>
</html>
